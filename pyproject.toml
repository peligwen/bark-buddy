[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bark-buddy"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "websockets>=12.0",
    "pyserial-asyncio>=0.6",
    "numpy>=1.24",
    "zeroconf>=0.131",
]

[project.scripts]
bark = "bark_cli:main"

[tool.setuptools]
py-modules = ["bark_cli"]
