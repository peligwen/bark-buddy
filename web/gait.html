<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gait Tuning — Bark-Buddy</title>
<style>
  :root {
    --bg: #111318;
    --bg-panel: #181b22;
    --bg-card: #1e222b;
    --text: #e0e0e0;
    --text-muted: #6b7280;
    --text-dim: #4b5160;
    --accent: #d4880e;
    --accent-dark: #b8720a;
    --border: #2a2f3a;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    padding: 24px;
    max-width: 720px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 4px;
  }
  .subtitle { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 20px; }
  code { font-family: "SF Mono", "Fira Code", monospace; }

  /* Nav */
  .page-nav {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
  }
  .nav-link {
    font-size: 0.75rem;
    padding: 5px 12px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-muted);
    text-decoration: none;
    transition: background 0.15s;
  }
  .nav-link:hover { background: var(--border); color: var(--text); }
  .nav-link.active { background: var(--accent); color: #fff; border-color: var(--accent-dark); }

  /* Status bar */
  .status-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 20px;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--text-dim);
    flex-shrink: 0;
  }
  .dot.connected { background: #4ade80; }
  #status-text { font-size: 0.75rem; color: var(--text-muted); flex: 1; }
  .test-btn {
    font-size: 0.75rem;
    padding: 5px 12px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text);
    cursor: pointer;
    transition: background 0.15s;
  }
  .test-btn:hover { background: var(--border); }
  .test-btn.active { background: var(--accent); color: #fff; border-color: var(--accent-dark); }
  .test-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .test-btn:disabled:hover { background: var(--bg-card); }

  /* Lifecycle badge */
  .lifecycle-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 0.7rem;
    font-family: "SF Mono", "Fira Code", monospace;
    font-weight: 600;
    letter-spacing: 0.04em;
    padding: 3px 8px;
    border-radius: 4px;
    background: rgba(107,114,128,0.15);
    border: 1px solid rgba(107,114,128,0.3);
    color: #6b7280;
    transition: color 0.3s, background 0.3s, border-color 0.3s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .lifecycle-badge .lc-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: currentColor;
    flex-shrink: 0;
  }
  .lifecycle-badge[data-state="active"]   { color: #22c55e; background: rgba(34,197,94,0.1);  border-color: rgba(34,197,94,0.3); }
  .lifecycle-badge[data-state="waking"]   { color: #f59e0b; background: rgba(245,158,11,0.1); border-color: rgba(245,158,11,0.3); }
  .lifecycle-badge[data-state="idle"]     { color: #eab308; background: rgba(234,179,8,0.1);  border-color: rgba(234,179,8,0.3); }
  .lifecycle-badge[data-state="sleeping"] { color: #f97316; background: rgba(249,115,22,0.1); border-color: rgba(249,115,22,0.3); }
  .lifecycle-badge[data-state="resting"]  { color: #6b7280; background: rgba(107,114,128,0.1); border-color: rgba(107,114,128,0.3); }
  .lifecycle-badge[data-state="booting"]  { color: #6b7280; background: rgba(107,114,128,0.1); border-color: rgba(107,114,128,0.3); }

  @keyframes lc-pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.45; }
  }
  .lifecycle-badge[data-state="waking"] .lc-dot {
    animation: lc-pulse 1.2s ease-in-out infinite;
  }

  /* Waking banner */
  #waking-banner {
    display: none;
    align-items: center;
    gap: 10px;
    background: rgba(245,158,11,0.12);
    border: 1px solid rgba(245,158,11,0.35);
    border-radius: 8px;
    padding: 9px 14px;
    font-size: 0.75rem;
    color: #f59e0b;
    margin-bottom: 20px;
  }
  #waking-banner.show { display: flex; }
  #waking-banner .lc-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #f59e0b;
    flex-shrink: 0;
    animation: lc-pulse 1.2s ease-in-out infinite;
  }

  /* Parameter cards */
  .param-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .param-card h2 {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 14px;
    letter-spacing: 0.02em;
  }

  /* Slider rows */
  .slider-row {
    display: grid;
    grid-template-columns: 120px 1fr 50px;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }
  .slider-row:last-child { margin-bottom: 0; }
  .slider-label {
    font-size: 0.78rem;
    color: var(--text-muted);
    font-family: "SF Mono", "Fira Code", monospace;
  }
  .slider-unit {
    font-size: 0.65rem;
    color: var(--text-dim);
    font-family: "SF Mono", "Fira Code", monospace;
    margin-left: 2px;
  }
  .slider-value {
    font-size: 0.78rem;
    font-family: "SF Mono", "Fira Code", monospace;
    color: var(--accent);
    text-align: right;
    white-space: nowrap;
  }
  input[type=range] {
    width: 100%;
    accent-color: var(--accent);
    cursor: pointer;
  }

  /* PID rows */
  .pid-row {
    display: grid;
    grid-template-columns: 120px 1fr;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }
  .pid-row:last-child { margin-bottom: 0; }
  .pid-label {
    font-size: 0.78rem;
    color: var(--text-muted);
    font-family: "SF Mono", "Fira Code", monospace;
  }
  input[type=number] {
    width: 100%;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text);
    font-family: "SF Mono", "Fira Code", monospace;
    font-size: 0.8rem;
    padding: 4px 8px;
    text-align: right;
  }
  input[type=number]:focus {
    outline: 1px solid var(--accent);
    border-color: var(--accent);
  }
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }

  /* Event log */
  .event-log-section { margin-top: 28px; }
  .event-log-wrap {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .event-log-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 0.72rem;
    color: var(--text-muted);
  }
  .event-log-clear {
    font-size: 0.68rem;
    padding: 2px 8px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
  }
  .event-log-clear:hover { background: var(--border); }
  #event-log {
    height: 180px;
    overflow-y: auto;
    font-family: "SF Mono", "Fira Code", monospace;
    font-size: 0.7rem;
    padding: 6px 0;
  }
  .ev-row {
    display: grid;
    grid-template-columns: 80px 120px 1fr;
    gap: 8px;
    padding: 2px 14px;
    line-height: 1.5;
    color: var(--text-muted);
  }
  .ev-row:hover { background: rgba(255,255,255,0.03); }
  .ev-ts { color: var(--text-dim); }
  .ev-name { color: var(--text); font-weight: 600; }
  .ev-row.evt-warn .ev-name { color: #f97316; }
  .ev-row.evt-lifecycle .ev-name { color: #60a5fa; }
  .ev-detail { color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>

<nav class="page-nav">
  <a href="/tuning" class="nav-link">Tuning</a>
  <a href="/gait"   class="nav-link active">Gait</a>
  <a href="/"       class="nav-link">Main</a>
</nav>

<h1>Gait Tuning</h1>
<p class="subtitle">Adjust stride, height, speed, and balance PID. Engage servos first.</p>

<div class="status-bar">
  <div class="dot" id="ws-dot"></div>
  <span id="status-text">Connecting...</span>
  <div class="lifecycle-badge" id="lifecycle-badge" data-state="unknown"><span class="lc-dot"></span><span id="lifecycle-text">-</span></div>
  <button class="test-btn" id="engage-btn" onclick="toggleEngage()" disabled>Engage Servos</button>
</div>

<div id="waking-banner"><span class="lc-dot"></span><span>Waking up - resend your command once active</span></div>

<!-- Gait Parameters -->
<div class="param-card">
  <h2>Gait Parameters</h2>

  <div class="slider-row">
    <span class="slider-label">Stride Length<span class="slider-unit"> mm</span></span>
    <input type="range" id="stride-length-range" min="0" max="60" step="1" value="20">
    <span class="slider-value" id="stride-length-val">20</span>
  </div>

  <div class="slider-row">
    <span class="slider-label">Stride Height<span class="slider-unit"> mm</span></span>
    <input type="range" id="stride-height-range" min="0" max="40" step="1" value="10">
    <span class="slider-value" id="stride-height-val">10</span>
  </div>

  <div class="slider-row">
    <span class="slider-label">Speed<span class="slider-unit"> x</span></span>
    <input type="range" id="speed-range" min="0.1" max="3.0" step="0.1" value="1.0">
    <span class="slider-value" id="speed-val">1.0</span>
  </div>
</div>

<!-- Balance PID -->
<div class="param-card">
  <h2>Balance PID</h2>

  <div class="pid-row">
    <span class="pid-label">Kp</span>
    <input type="number" id="pid-kp" min="0" max="5" step="0.1" value="1.2">
  </div>

  <div class="pid-row">
    <span class="pid-label">Ki</span>
    <input type="number" id="pid-ki" min="0" max="2" step="0.01" value="0.0">
  </div>

  <div class="pid-row">
    <span class="pid-label">Kd</span>
    <input type="number" id="pid-kd" min="0" max="2" step="0.01" value="0.05">
  </div>
</div>

<div class="event-log-section">
  <div class="event-log-wrap">
    <div class="event-log-header">
      <span>Firmware Event Log</span>
      <button class="event-log-clear" onclick="clearEventLog()">Clear</button>
    </div>
    <div id="event-log"></div>
  </div>
</div>

<script>
  // -- State -------------------------------------------------------
  let ws = null;
  let _engaged = false;
  let _gaitDebounce = null;
  let _pidDebounce = null;

  // -- WebSocket ---------------------------------------------------
  function connect() {
    ws = new WebSocket('ws://' + location.host + '/ws');
    ws.onopen  = () => {
      setStatus('connected', 'Connected');
      document.getElementById('waking-banner').classList.remove('show');
      document.getElementById('engage-btn').disabled = false;
    };
    ws.onclose = () => {
      setStatus('off', 'Disconnected - retrying...');
      setLifecycle(null);
      document.getElementById('engage-btn').disabled = true;
      setTimeout(connect, 2000);
    };
    ws.onerror = () => { setStatus('off', 'Connection error'); setLifecycle(null); };
    ws.onmessage = (event) => {
      try {
        const msg = JSON.parse(event.data);
        if (msg.type === 'telem_status') {
          if (msg.engaged != null) {
            _engaged = msg.engaged;
            const btn = document.getElementById('engage-btn');
            btn.textContent = msg.ramping ? 'Ramping...' : (msg.engaged ? 'Disengage' : 'Engage Servos');
            btn.disabled = !!msg.ramping || !!msg.battery_cutoff;
            btn.classList.toggle('active', !!msg.engaged && !msg.ramping);
            if (msg.ramping)       setLifecycle('waking');
            else if (msg.engaged)  setLifecycle('active');
            else                   setLifecycle('resting');
          }
        }
        if (msg.type === 'telem_event') {
          handleFwEvent(msg);
          if (msg.event === 'engage_complete')       { _engaged = true;  setLifecycle('active');  }
          if (msg.event === 'disengage_complete')    { _engaged = false; setLifecycle('resting'); }
          if (msg.event === 'battery_cutoff_detach') { _engaged = false; setLifecycle('resting'); }
          if (msg.event === 'heartbeat_detach')      { _engaged = false; setLifecycle('resting'); }
        }
        if (msg.type === 'ack') {
          if (!msg.ok && (msg.error === 'not_active' || msg.error === 'not_engaged')) {
            document.getElementById('waking-banner').classList.add('show');
          }
        }
        logAnyMessage(msg);
      } catch (_) {}
    };
  }

  function send(msg) {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify(msg));
    }
  }

  function toggleEngage() {
    send({ type: 'cmd_engage', enabled: !_engaged });
  }

  function setStatus(state, text) {
    const dot = document.getElementById('ws-dot');
    dot.className = 'dot';
    if (state === 'connected') dot.classList.add('connected');
    document.getElementById('status-text').textContent = text;
  }

  function setLifecycle(state) {
    const valid = ['active', 'waking', 'idle', 'sleeping', 'resting', 'booting'];
    if (state !== null && !valid.includes(state)) state = null;

    const badge  = document.getElementById('lifecycle-badge');
    const label  = document.getElementById('lifecycle-text');
    const banner = document.getElementById('waking-banner');

    if (!state) {
      badge.setAttribute('data-state', 'unknown');
      label.textContent = '-';
      banner.classList.remove('show');
      return;
    }

    badge.setAttribute('data-state', state);
    label.textContent = state.toUpperCase();
    if (state === 'waking') banner.classList.add('show');
    else                    banner.classList.remove('show');
  }

  // -- Gait params -------------------------------------------------
  function sendGaitParams() {
    send({
      type: 'cmd_gait_params',
      stride_length: parseFloat(document.getElementById('stride-length-range').value),
      stride_height: parseFloat(document.getElementById('stride-height-range').value),
      speed:         parseFloat(document.getElementById('speed-range').value)
    });
  }

  function onGaitChange() {
    // Update displayed values
    const sl = document.getElementById('stride-length-range').value;
    const sh = document.getElementById('stride-height-range').value;
    const sp = parseFloat(document.getElementById('speed-range').value).toFixed(1);
    document.getElementById('stride-length-val').textContent = sl;
    document.getElementById('stride-height-val').textContent = sh;
    document.getElementById('speed-val').textContent = sp;
    // Debounce send
    if (_gaitDebounce) clearTimeout(_gaitDebounce);
    _gaitDebounce = setTimeout(sendGaitParams, 100);
  }

  document.getElementById('stride-length-range').addEventListener('input', onGaitChange);
  document.getElementById('stride-height-range').addEventListener('input', onGaitChange);
  document.getElementById('speed-range').addEventListener('input', onGaitChange);

  // -- Balance PID -------------------------------------------------
  function sendBalancePID() {
    send({
      type: 'cmd_balance_pid',
      kp: parseFloat(document.getElementById('pid-kp').value),
      ki: parseFloat(document.getElementById('pid-ki').value),
      kd: parseFloat(document.getElementById('pid-kd').value)
    });
  }

  function onPIDChange() {
    if (_pidDebounce) clearTimeout(_pidDebounce);
    _pidDebounce = setTimeout(sendBalancePID, 100);
  }

  document.getElementById('pid-kp').addEventListener('input', onPIDChange);
  document.getElementById('pid-ki').addEventListener('input', onPIDChange);
  document.getElementById('pid-kd').addEventListener('input', onPIDChange);

  // -- Firmware event log ------------------------------------------
  const MAX_LOG_ROWS = 200;
  const LOGGED_TYPES = new Set([
    'telem_event', 'telem_status', 'telem_imu', 'telem_sonar',
    'telem_battery', 'telem_button', 'ack'
  ]);

  function logAnyMessage(msg) {
    // Log all inbound firmware messages that aren't just telemetry noise
    if (!LOGGED_TYPES.has(msg.type)) return;
    handleFwEvent(msg);
  }

  function handleFwEvent(msg) {
    const log = document.getElementById('event-log');
    if (!log) return;

    const ts = new Date();
    const hh = String(ts.getHours()).padStart(2,'0');
    const mm = String(ts.getMinutes()).padStart(2,'0');
    const ss = String(ts.getSeconds()).padStart(2,'0');
    const ms = String(ts.getMilliseconds()).padStart(3,'0');
    const timeStr = hh+':'+mm+':'+ss+'.'+ms;

    const evName = msg.event || msg.type || '?';
    let extra = Object.entries(msg)
      .filter(function(pair) { return !['type','event','t'].includes(pair[0]); })
      .map(function(pair) { return pair[0]+'='+JSON.stringify(pair[1]); })
      .join('  ');
    if (extra.length > 300) extra = extra.slice(0, 297) + '...';

    const row = document.createElement('div');
    const isWarn = /timeout|lost|rejected|low_battery/.test(evName);
    const isLc   = evName === 'lifecycle';
    row.className = 'ev-row' + (isWarn ? ' evt-warn' : '') + (isLc ? ' evt-lifecycle' : '');

    const tsEl = document.createElement('span');
    tsEl.className = 'ev-ts';
    tsEl.textContent = timeStr;

    const nameEl = document.createElement('span');
    nameEl.className = 'ev-name';
    nameEl.textContent = evName;

    const detailEl = document.createElement('span');
    detailEl.className = 'ev-detail';
    detailEl.textContent = extra;

    row.appendChild(tsEl);
    row.appendChild(nameEl);
    row.appendChild(detailEl);

    log.appendChild(row);
    while (log.children.length > MAX_LOG_ROWS) log.removeChild(log.firstChild);
    log.scrollTop = log.scrollHeight;
  }

  function clearEventLog() {
    const log = document.getElementById('event-log');
    if (log) log.textContent = '';
  }

  // -- Init --------------------------------------------------------
  connect();
</script>
</body>
</html>
