<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Servo Tuning — Bark-Buddy</title>
<style>
  :root {
    --bg: #111318;
    --bg-panel: #181b22;
    --bg-card: #1e222b;
    --text: #e0e0e0;
    --text-muted: #6b7280;
    --text-dim: #4b5160;
    --accent: #d4880e;
    --accent-dark: #b8720a;
    --border: #2a2f3a;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    padding: 24px;
    max-width: 900px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 4px;
  }
  .subtitle { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 20px; }
  code { font-family: "SF Mono", "Fira Code", monospace; }

  /* Nav */
  .page-nav {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
  }
  .nav-link {
    font-size: 0.75rem;
    padding: 5px 12px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-muted);
    text-decoration: none;
    transition: background 0.15s;
  }
  .nav-link:hover { background: var(--border); color: var(--text); }
  .nav-link.active { background: var(--accent); color: #fff; border-color: var(--accent-dark); }

  /* Status bar */
  .status-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 20px;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--text-dim);
    flex-shrink: 0;
  }
  .dot.connected { background: #4ade80; }
  .dot.test-mode { background: var(--accent); }
  #status-text { font-size: 0.75rem; color: var(--text-muted); flex: 1; }
  .test-btn {
    font-size: 0.75rem;
    padding: 5px 12px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text);
    cursor: pointer;
    transition: background 0.15s;
  }
  .test-btn:hover { background: var(--border); }
  .test-btn.active { background: var(--accent); color: #fff; border-color: var(--accent-dark); }
  .test-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .test-btn:disabled:hover { background: var(--bg-card); }

  /* Lifecycle badge */
  .lifecycle-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 0.7rem;
    font-family: "SF Mono", "Fira Code", monospace;
    font-weight: 600;
    letter-spacing: 0.04em;
    padding: 3px 8px;
    border-radius: 4px;
    background: rgba(107,114,128,0.15);
    border: 1px solid rgba(107,114,128,0.3);
    color: #6b7280;
    transition: color 0.3s, background 0.3s, border-color 0.3s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .lifecycle-badge .lc-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: currentColor;
    flex-shrink: 0;
  }
  .lifecycle-badge[data-state="active"]   { color: #22c55e; background: rgba(34,197,94,0.1);  border-color: rgba(34,197,94,0.3); }
  .lifecycle-badge[data-state="waking"]   { color: #f59e0b; background: rgba(245,158,11,0.1); border-color: rgba(245,158,11,0.3); }
  .lifecycle-badge[data-state="idle"]     { color: #eab308; background: rgba(234,179,8,0.1);  border-color: rgba(234,179,8,0.3); }
  .lifecycle-badge[data-state="sleeping"] { color: #f97316; background: rgba(249,115,22,0.1); border-color: rgba(249,115,22,0.3); }
  .lifecycle-badge[data-state="resting"]  { color: #6b7280; background: rgba(107,114,128,0.1); border-color: rgba(107,114,128,0.3); }
  .lifecycle-badge[data-state="booting"]  { color: #6b7280; background: rgba(107,114,128,0.1); border-color: rgba(107,114,128,0.3); }

  @keyframes lc-pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.45; }
  }
  .lifecycle-badge[data-state="waking"] .lc-dot {
    animation: lc-pulse 1.2s ease-in-out infinite;
  }

  /* Battery bar */
  .batt-wrap {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    flex-shrink: 0;
  }
  .batt-label {
    font-size: 0.65rem;
    font-family: "SF Mono", "Fira Code", monospace;
    font-weight: 600;
    color: var(--text-dim);
    letter-spacing: 0.04em;
  }
  .batt-bar {
    display: flex;
    gap: 2px;
    align-items: center;
    padding: 3px 5px;
    background: rgba(0,0,0,0.25);
    border: 1px solid var(--border);
    border-radius: 4px;
  }
  .batt-seg {
    width: 6px;
    height: 14px;
    border-radius: 2px;
    opacity: 0.15;
    transition: opacity 0.3s;
  }
  .batt-seg.lit { opacity: 1; }
  .batt-seg:nth-child(1)  { background: hsl(0,   70%, 55%); }
  .batt-seg:nth-child(2)  { background: hsl(13,  70%, 55%); }
  .batt-seg:nth-child(3)  { background: hsl(27,  70%, 55%); }
  .batt-seg:nth-child(4)  { background: hsl(40,  70%, 55%); }
  .batt-seg:nth-child(5)  { background: hsl(53,  70%, 55%); }
  .batt-seg:nth-child(6)  { background: hsl(67,  70%, 55%); }
  .batt-seg:nth-child(7)  { background: hsl(80,  70%, 55%); }
  .batt-seg:nth-child(8)  { background: hsl(93,  70%, 55%); }
  .batt-seg:nth-child(9)  { background: hsl(107, 70%, 55%); }
  .batt-seg:nth-child(10) { background: hsl(120, 70%, 55%); }
  @keyframes batt-flash {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.3; }
  }
  .batt-bar.critical .batt-seg.lit {
    animation: batt-flash 1s ease-in-out infinite;
  }
  .batt-bar.stale .batt-seg { opacity: 0.08; }

  /* Waking banner */
  #waking-banner {
    display: none;
    align-items: center;
    gap: 10px;
    background: rgba(245,158,11,0.12);
    border: 1px solid rgba(245,158,11,0.35);
    border-radius: 8px;
    padding: 9px 14px;
    font-size: 0.75rem;
    color: #f59e0b;
    margin-bottom: 20px;
  }
  #waking-banner.show { display: flex; }
  #waking-banner .lc-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #f59e0b;
    flex-shrink: 0;
    animation: lc-pulse 1.2s ease-in-out infinite;
  }

  /* Event log */
  .event-log-section { margin-top: 28px; }
  .event-log-wrap {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .event-log-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 0.72rem;
    color: var(--text-muted);
  }
  .event-log-clear {
    font-size: 0.68rem;
    padding: 2px 8px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
  }
  .event-log-clear:hover { background: var(--border); }
  #event-log {
    height: 180px;
    overflow-y: auto;
    font-family: "SF Mono", "Fira Code", monospace;
    font-size: 0.7rem;
    padding: 6px 0;
  }
  .ev-row {
    display: grid;
    grid-template-columns: 80px 120px 1fr;
    gap: 8px;
    padding: 2px 14px;
    line-height: 1.5;
    color: var(--text-muted);
  }
  .ev-row:hover { background: rgba(255,255,255,0.03); }
  .ev-ts { color: var(--text-dim); }
  .ev-name { color: var(--text); font-weight: 600; }
  .ev-row.evt-warn .ev-name { color: #f97316; }
  .ev-row.evt-lifecycle .ev-name { color: #60a5fa; }
  .ev-detail { color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Presets */
  .presets {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    align-items: center;
  }
  .preset-btn {
    font-size: 0.75rem;
    padding: 6px 14px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text);
    cursor: pointer;
    transition: background 0.15s;
  }
  .preset-btn:hover { background: var(--border); }
  .copy-btn {
    margin-left: auto;
    background: var(--bg-panel);
    border-color: var(--accent-dark);
    color: var(--accent);
  }
  .copy-btn:hover { background: var(--accent); color: #fff; }
  #copy-feedback {
    font-size: 0.7rem;
    color: #4ade80;
    opacity: 0;
    transition: opacity 0.3s;
  }
  #copy-feedback.show { opacity: 1; }

  /* Servo grid */
  .servo-grid {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .servo-row {
    display: grid;
    grid-template-columns: 100px 1.5fr 1fr 70px 80px 36px;
    align-items: center;
    gap: 12px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    transition: background 0.15s;
  }
  .offset-cell {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 70px;
  }
  .offset-label {
    font-size: 0.65rem;
    color: var(--text-dim);
    font-family: "SF Mono", "Fira Code", monospace;
    text-align: center;
  }
  .offset-input {
    width: 100%;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--accent);
    font-family: "SF Mono", "Fira Code", monospace;
    font-size: 0.8rem;
    padding: 3px 5px;
    text-align: right;
  }
  .offset-input:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
  .offset-input::-webkit-inner-spin-button,
  .offset-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .offset-input { -moz-appearance: textfield; }

  .servo-label { display: flex; flex-direction: column; gap: 2px; }
  .servo-name {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text);
    font-family: "SF Mono", "Fira Code", monospace;
  }
  .servo-idx {
    font-size: 0.7rem;
    color: var(--text-dim);
    font-family: "SF Mono", "Fira Code", monospace;
  }

  input[type=range] {
    width: 100%;
    accent-color: var(--accent);
    cursor: pointer;
  }
  input[type=range]:disabled { opacity: 0.4; cursor: not-allowed; }
  input[type=number] {
    width: 100%;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text);
    font-family: "SF Mono", "Fira Code", monospace;
    font-size: 0.8rem;
    padding: 4px 6px;
    text-align: right;
  }
  input[type=number]:focus {
    outline: 1px solid var(--accent);
    border-color: var(--accent);
  }
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }

  .wiggle-btn {
    width: 32px;
    font-size: 0.9rem;
    font-weight: 700;
    padding: 0;
    line-height: 1;
  }
  .wiggle-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent-dark);
    pointer-events: none;
  }

  /* Pin select dropdown */
  .pin-select {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text);
    font-family: "SF Mono", "Fira Code", monospace;
    font-size: 0.75rem;
    padding: 5px 8px;
    cursor: pointer;
    width: 100%;
  }
  .pin-select:focus { outline: 1px solid var(--accent); }
  .pin-select.strapping { border-color: rgba(245,158,11,0.5); }
  .pin-select.updating  { opacity: 0.5; pointer-events: none; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: #1e222b;
    border: 1px solid #f87171;
    color: #f87171;
    border-radius: 8px;
    padding: 8px 18px;
    font-size: 0.8rem;
    font-family: "SF Mono", "Fira Code", monospace;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
    z-index: 1000;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<nav class="page-nav">
  <a href="/tuning" class="nav-link active">Tuning</a>
  <a href="/gait"   class="nav-link">Gait</a>
  <a href="/"       class="nav-link">Main</a>
</nav>

<h1>Servo Tuning</h1>
<p class="subtitle">Assign GPIO pins, trim offsets, and wiggle servos for identification. Engage first.</p>

<div class="status-bar">
  <div class="dot" id="ws-dot"></div>
  <span id="status-text">Connecting...</span>
  <div class="lifecycle-badge" id="lifecycle-badge" data-state="unknown"><span class="lc-dot"></span><span id="lifecycle-text">-</span></div>
  <div class="batt-wrap" title="Battery: no signal">
    <span class="batt-label">Batt</span>
    <div class="batt-bar stale" id="batt-bar">
      <span class="batt-seg" data-idx="0"></span>
      <span class="batt-seg" data-idx="1"></span>
      <span class="batt-seg" data-idx="2"></span>
      <span class="batt-seg" data-idx="3"></span>
      <span class="batt-seg" data-idx="4"></span>
      <span class="batt-seg" data-idx="5"></span>
      <span class="batt-seg" data-idx="6"></span>
      <span class="batt-seg" data-idx="7"></span>
      <span class="batt-seg" data-idx="8"></span>
      <span class="batt-seg" data-idx="9"></span>
    </div>
  </div>
  <button class="test-btn" id="engage-btn" onclick="toggleEngage()" disabled>Engage Servos</button>
</div>

<div id="waking-banner"><span class="lc-dot"></span><span>Waking up - resend your command once active</span></div>

<div class="presets">
  <button class="preset-btn" onclick="loadPreset(STANDING_POSE)">Standing</button>
  <button class="preset-btn" onclick="loadPreset(REST_POSE)">Rest</button>
  <button class="preset-btn" onclick="loadPreset(CENTER_POSE)">Center</button>
  <button class="preset-btn copy-btn" onclick="copyValues()">Copy SERVO_PINS</button>
  <span id="copy-feedback">Copied!</span>
</div>

<div id="diag-bar" style="font-size:0.65rem;color:var(--text-dim);font-family:'SF Mono','Fira Code',monospace;margin-bottom:20px;">TX: 0 | ACK: 0</div>

<div class="servo-grid" id="servo-grid"></div>

<div class="event-log-section">
  <div class="event-log-wrap">
    <div class="event-log-header">
      <span>Firmware Event Log</span>
      <button class="event-log-clear" onclick="clearEventLog()">Clear</button>
    </div>
    <div id="event-log"></div>
  </div>
</div>

<script>
  // -- Servo config (mirrors config.h) --------------------------
  const SERVO_NAMES   = ['FL_hip','FL_knee','FR_hip','FR_knee','RL_hip','RL_knee','RR_hip','RR_knee'];
  const STANDING_POSE = [2096, 1621, 2170, 1611,  904, 1379,  830, 1389];
  const REST_POSE     = [1800, 1500, 1870, 1500, 1202, 1500, 1165, 1500];
  const CENTER_POSE   = [1500, 1500, 1500, 1500, 1500, 1500, 1500, 1500];
  // -- Pin catalog -----------------------------------------------
  const PIN_CATALOG = [
    // Main servo headers
    { gpio: 25, label: 'GPIO 25 - SERVO1',  note: 'VIN rail servo port',                                        reserved: false, strapping: false },
    { gpio: 26, label: 'GPIO 26 - SERVO2',  note: 'VIN rail servo port',                                        reserved: false, strapping: false },
    { gpio: 27, label: 'GPIO 27 - SERVO3',  note: 'VIN rail servo port',                                        reserved: false, strapping: false },
    { gpio: 14, label: 'GPIO 14 - SERVO4',  note: 'VIN rail servo port',                                        reserved: false, strapping: false },
    { gpio: 16, label: 'GPIO 16 - SERVO5',  note: 'VIN rail servo port',                                        reserved: false, strapping: false },
    { gpio: 17, label: 'GPIO 17 - SERVO6',  note: 'VIN rail servo port',                                        reserved: false, strapping: false },
    { gpio: 4,  label: 'GPIO 4  - SERVO10', note: '5V regulated rail servo port',                               reserved: false, strapping: false },
    { gpio: 2,  label: 'GPIO 2  - SERVO8',  note: 'strapping: boot mode latch if LOW',                          reserved: false, strapping: true  },
    { gpio: 15, label: 'GPIO 15 - SERVO7',  note: 'strapping: silences boot log if LOW',                        reserved: false, strapping: true  },
    { gpio: 0,  label: 'GPIO 0  - SERVO9',  note: 'strapping: download mode if LOW at boot',                    reserved: false, strapping: true  },
    { gpio: 12, label: 'GPIO 12 - SERVO11', note: 'strapping: flash voltage select - series 5.1K; keep LOW',    reserved: false, strapping: true  },
    // Free output GPIOs (not on servo headers)
    { gpio: 32, label: 'GPIO 32 - J5 expander', note: 'free output (AUX_GPIO)',                                  reserved: false, strapping: false },
    { gpio: 33, label: 'GPIO 33 - J5 expander', note: 'free output (AUX_GPIO)',                                  reserved: false, strapping: false },
    // Reserved -- shown disabled so user understands the full pin map
    { gpio: 5,  label: 'GPIO 5  - Button K1',   note: 'reserved: button input',                                  reserved: true  },
    { gpio: 18, label: 'GPIO 18 - Onboard LED',  note: 'reserved: LED driver',                                   reserved: true  },
    { gpio: 21, label: 'GPIO 21 - Buzzer',        note: 'reserved: buzzer NPN',                                  reserved: true  },
    { gpio: 22, label: 'GPIO 22 - I2C1 SCL',      note: 'reserved: IMU + sonar',                                 reserved: true  },
    { gpio: 23, label: 'GPIO 23 - I2C1 SDA',      note: 'reserved: IMU + sonar',                                 reserved: true  },
    { gpio: 19, label: 'GPIO 19 - I2C2 SDA',      note: 'reserved: J4 expansion',                                reserved: true  },
    { gpio: 13, label: 'GPIO 13 - I2C2 SCL',      note: 'reserved: J4 expansion',                                reserved: true  },
    { gpio: 34, label: 'GPIO 34 - Battery ADC',   note: 'reserved: battery monitor (input-only)',                reserved: true  },
    { gpio: 35, label: 'GPIO 35 - IMU INT2',       note: 'reserved: IMU interrupt (input-only)',                 reserved: true  },
    { gpio: 1,  label: 'GPIO 1  - UART0 TX',      note: 'breaks serial if driven as output',                     reserved: true  },
    { gpio: 3,  label: 'GPIO 3  - UART0 RX',      note: 'breaks serial boot if driven',                          reserved: true  },
    { gpio: 36, label: 'GPIO 36 - input-only',    note: 'ADC only - cannot drive as output',                     reserved: true  },
    { gpio: 39, label: 'GPIO 39 - input-only',    note: 'ADC only - cannot drive as output',                     reserved: true  },
  ];

  // -- State -----------------------------------------------------
  let ws = null;
  let _tuningEngaged = false;
  let lifecycleState = null;
  const activeWiggles = new Map();

  // Authoritative pin->servo mapping, updated from telem_servo_pins
  let currentPins = [25, 26, 27, 14, 16, 17, 4, 2];  // mirrors default SERVO_PINS

  // Per-servo position state (slider source of truth)
  const SERVO_MIN = 500;
  const SERVO_MAX = 2500;
  const THROTTLE_MS = 50;
  const values     = new Array(8).fill(1500);
  const _lastSend  = new Array(8).fill(0);
  const _pendingVal = new Array(8).fill(null);
  const _pendingTmr = new Array(8).fill(null);
  let _dragging = false;

  // Per-servo offset state
  const offsets = new Array(8).fill(0);

  // Diagnostics
  let _msgSent = 0;
  let _ackRecv = 0;
  function updateDiagCounter() {
    const el = document.getElementById('diag-bar');
    if (el) el.textContent = 'TX: ' + _msgSent + ' | ACK: ' + _ackRecv;
  }

  // -- Toast -----------------------------------------------------
  let _toastTimer = null;
  function showToast(msg) {
    let el = document.getElementById('toast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'toast';
      el.className = 'toast';
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.classList.add('show');
    if (_toastTimer) clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
  }

  // -- WebSocket -------------------------------------------------
  function toggleEngage() {
    send({ type: 'cmd_engage', enabled: !_tuningEngaged });
  }

  function cancelAllWiggles() {
    for (const [, { interval, btn }] of activeWiggles) {
      clearInterval(interval);
      btn.classList.remove('active');
      btn.disabled = false;
    }
    activeWiggles.clear();
  }

  // -- Battery bar -----------------------------------------------
  var _battStaleTimer = null;
  var _battSegs = null;

  function updateBatteryBar({ voltage_mv, pct, low }) {
    if (!_battSegs) _battSegs = document.querySelectorAll('#batt-bar .batt-seg');
    const bar  = document.getElementById('batt-bar');
    const wrap = bar && bar.closest('.batt-wrap');
    if (!bar) return;

    clearTimeout(_battStaleTimer);
    bar.classList.remove('stale');
    _battStaleTimer = setTimeout(function() {
      bar.classList.add('stale');
      bar.classList.remove('critical');
      _battSegs.forEach(function(s) { s.classList.remove('lit'); });
      if (wrap) wrap.title = 'Battery: no signal';
    }, 5000);

    const lit = Math.min(10, Math.ceil(pct / 10));
    _battSegs.forEach(function(s, i) { s.classList.toggle('lit', i < lit); });
    bar.classList.toggle('critical', !!low || pct <= 10);
    if (wrap) wrap.title = 'Battery: ' + voltage_mv + ' mV (' + pct + '%)';
  }

  function connect() {
    ws = new WebSocket('ws://' + location.host + '/ws');
    ws.onopen  = () => {
      setStatus('connected', 'Connected');
      document.getElementById('waking-banner')?.classList.remove('show');
      queryAllOffsets();
    };
    ws.onclose = () => {
      setStatus('off', 'Disconnected - retrying...');
      setLifecycle(null);
      cancelAllWiggles();
      setTimeout(connect, 2000);
    };
    ws.onerror = () => { setStatus('off', 'Connection error'); setLifecycle(null); };
    ws.onmessage = (event) => {
      try {
        const msg = JSON.parse(event.data);
        if (msg.type === 'telem_status') {
          if (msg.engaged != null) {
            _tuningEngaged = msg.engaged;
            const btn = document.getElementById('engage-btn');
            if (btn) {
              btn.textContent = msg.ramping ? 'Ramping...' : (msg.engaged ? 'Disengage' : 'Engage Servos');
              btn.disabled = !!msg.ramping || !!msg.battery_cutoff;
              btn.classList.toggle('active', !!msg.engaged && !msg.ramping);
            }
            var ctrlsDisabled = !msg.engaged || !!msg.ramping;
            document.querySelectorAll('.wiggle-btn').forEach(function(el) {
              el.disabled = ctrlsDisabled;
            });
            document.querySelectorAll('input[type=range]').forEach(function(el) {
              el.disabled = ctrlsDisabled;
            });
            document.querySelectorAll('#servo-grid input[type=number]').forEach(function(el) {
              el.disabled = ctrlsDisabled;
            });
            if (!msg.engaged) cancelAllWiggles();
          }
          if (msg.engaged != null) {
            if (msg.ramping) setLifecycle('waking');
            else if (msg.engaged) setLifecycle('active');
            else setLifecycle('resting');
          }
        }
        if (msg.type === 'telem_event') {
          handleFwEvent(msg);
          if (msg.event === 'engage_complete')       { _tuningEngaged = true;  setLifecycle('active');  }
          if (msg.event === 'disengage_complete')    { _tuningEngaged = false; setLifecycle('resting'); }
          if (msg.event === 'battery_cutoff_detach') { _tuningEngaged = false; setLifecycle('resting'); }
          if (msg.event === 'heartbeat_detach')      { _tuningEngaged = false; setLifecycle('resting'); }
        }
        if (msg.type === 'telem_battery') updateBatteryBar(msg);
        if (msg.type === 'telem_servo_pins') handleServoPins(msg);
        if (msg.type === 'ack') {
          if (!msg.ok && (msg.error === 'not_active' || msg.error === 'not_engaged')) {
            const banner = document.getElementById('waking-banner');
            if (banner) banner.classList.add('show');
          }
          if (msg.ref_type === 'cmd_servo_pin') handleServoPinAck(msg);
          if (msg.ref_type === 'cmd_offset')    handleOffsetAck(msg);
          if (msg.ref_type === 'cmd_servo') {
            _ackRecv++;
            updateDiagCounter();
          }
        }
      } catch (_) {}
    };
  }

  function send(msg) {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify(msg));
      if (msg.type === 'cmd_servo') {
        _msgSent++;
        console.log('[TX #' + _msgSent + '] cmd_servo idx=' + msg.index + ' pulse=' + msg.pulse_us);
        updateDiagCounter();
      }
    } else if (msg.type === 'cmd_servo') {
      console.warn('[TX DROPPED] ws not open, state=' + (ws ? ws.readyState : 'null'));
    }
  }

  function setStatus(state, text) {
    const dot = document.getElementById('ws-dot');
    dot.className = 'dot';
    if (state === 'connected') dot.classList.add('connected');
    document.getElementById('status-text').textContent = text;
  }

  function setLifecycle(state) {
    const valid = ['active', 'waking', 'idle', 'sleeping', 'resting', 'booting'];
    if (state !== null && !valid.includes(state)) state = null;

    lifecycleState = state;
    const badge = document.getElementById('lifecycle-badge');
    const label = document.getElementById('lifecycle-text');
    const banner = document.getElementById('waking-banner');

    if (!state) {
      badge.setAttribute('data-state', 'unknown');
      label.textContent = '-';
      banner.classList.remove('show');
      return;
    }

    badge.setAttribute('data-state', state);
    label.textContent = state.toUpperCase();

    if (state === 'waking') {
      banner.classList.add('show');
    } else {
      banner.classList.remove('show');
    }
  }

  // -- Pin select helpers ----------------------------------------
  function buildPinSelectOptions(sel, selectedGpio, thisIdx) {
    while (sel.firstChild) sel.removeChild(sel.firstChild);
    PIN_CATALOG.forEach(function(entry) {
      const gpio = entry.gpio;
      const label = entry.label;
      const note = entry.note;
      const reserved = entry.reserved;
      const strapping = entry.strapping;
      const opt = document.createElement('option');
      opt.value = gpio;
      let optText = label + ' - ' + note;
      if (reserved) {
        opt.disabled = true;
        optText += ' [reserved]';
      } else {
        const usedBy = currentPins.findIndex(function(p, j) { return j !== thisIdx && p === gpio; });
        if (usedBy >= 0) {
          optText += ' [swap with servo ' + usedBy + ']';
        }
      }
      opt.textContent = optText;
      if (gpio === selectedGpio) opt.selected = true;
      if (strapping && !reserved) opt.style.color = '#f59e0b';
      sel.appendChild(opt);
    });
    const entry = PIN_CATALOG.find(function(e) { return e.gpio === selectedGpio; });
    sel.classList.toggle('strapping', !!(entry && entry.strapping));
  }

  // -- Servo pin ack handlers ------------------------------------
  function handleServoPinAck(msg) {
    for (let i = 0; i < 8; i++) {
      const sel = document.getElementById('pin-sel-' + i);
      if (!sel) continue;
      sel.classList.remove('updating');
      if (!msg.ok) buildPinSelectOptions(sel, currentPins[i], i);
    }
    if (!msg.ok) showToast('Pin rejected: ' + (msg.error || 'unknown error'));
    // If ok=true, telem_servo_pins will rebuild options with the updated mapping
  }

  function handleServoPins(msg) {
    if (!Array.isArray(msg.pins) || msg.pins.length < 8) return;
    currentPins = msg.pins.slice(0, 8);
    for (let i = 0; i < 8; i++) {
      const sel = document.getElementById('pin-sel-' + i);
      if (!sel) continue;
      sel.classList.remove('updating');
      buildPinSelectOptions(sel, currentPins[i], i);
    }
  }

  // -- Per-servo offsets -----------------------------------------
  function queryAllOffsets() {
    send({ type: 'cmd_offset' });  // no index -> read all
  }

  function handleOffsetAck(msg) {
    if (!Array.isArray(msg.offsets) || msg.offsets.length !== 8) return;
    msg.offsets.forEach(function(val, i) {
      if (i >= 8) return;
      offsets[i] = val;
      const el = document.getElementById('offset-' + i);
      if (el) el.value = val;
    });
  }

  // -- Wiggle servo for identification ---------------------------
  function wiggleServo(index, btn) {
    if (!_tuningEngaged) {
      showToast('Engage servos first to wiggle');
      return;
    }
    if (activeWiggles.has(index)) return;
    const center = 1500;
    const amplitude = 20;
    const halfPeriod = 250;
    const totalSteps = 8;
    let step = 0;
    btn.classList.add('active');
    btn.disabled = true;
    const id = setInterval(function() {
      const target = (step % 2 === 0) ? center + amplitude : center - amplitude;
      send({ type: 'cmd_servo', index: index, pulse_us: target });
      var sl = document.getElementById('slider-' + index);
      var n  = document.getElementById('num-' + index);
      if (sl) sl.value = target;
      if (n)  n.value  = target;
      step++;
      if (step >= totalSteps) {
        clearInterval(id);
        send({ type: 'cmd_servo', index: index, pulse_us: center });
        if (sl) sl.value = center;
        if (n)  n.value  = center;
        values[index] = center;
        btn.classList.remove('active');
        btn.disabled = false;
        activeWiggles.delete(index);
      }
    }, halfPeriod);
    activeWiggles.set(index, { interval: id, btn });
  }

  // -- Servo position send helpers --------------------------------
  function sendServo(index, value) {
    values[index] = value;
    send({ type: 'cmd_servo', index: index, pulse_us: value });
  }

  function throttledSendServo(index, value) {
    values[index] = value;
    var now = Date.now();
    if (now - _lastSend[index] >= THROTTLE_MS) {
      _lastSend[index] = now;
      _pendingVal[index] = null;
      send({ type: 'cmd_servo', index: index, pulse_us: value });
    } else {
      _pendingVal[index] = value;
      if (!_pendingTmr[index]) {
        var remaining = THROTTLE_MS - (now - _lastSend[index]);
        _pendingTmr[index] = setTimeout(function() {
          _pendingTmr[index] = null;
          if (_pendingVal[index] !== null) {
            _lastSend[index] = Date.now();
            send({ type: 'cmd_servo', index: index, pulse_us: _pendingVal[index] });
            _pendingVal[index] = null;
          }
        }, remaining);
      }
    }
  }

  // -- Build servo grid ------------------------------------------
  function buildGrid() {
    const grid = document.getElementById('servo-grid');
    SERVO_NAMES.forEach(function(name, i) {
      const row = document.createElement('div');
      row.className = 'servo-row';
      row.id = 'servo-row-' + i;

      // Label
      const label = document.createElement('div');
      label.className = 'servo-label';
      const nameEl = document.createElement('span');
      nameEl.className = 'servo-name';
      nameEl.textContent = name;
      const idxEl = document.createElement('span');
      idxEl.className = 'servo-idx';
      idxEl.textContent = 'idx ' + i;
      label.appendChild(nameEl);
      label.appendChild(idxEl);

      // Pin select
      const sel = document.createElement('select');
      sel.className = 'pin-select';
      sel.id = 'pin-sel-' + i;
      buildPinSelectOptions(sel, currentPins[i], i);
      (function(idx) {
        sel.onchange = function() {
          const newPin = parseInt(sel.value, 10);
          if (!Number.isFinite(newPin)) return;
          sel.classList.add('updating');
          send({ type: 'cmd_servo_pin', index: idx, pin: newPin });
        };
      })(i);

      // Offset input
      const offsetCell = document.createElement('div');
      offsetCell.className = 'offset-cell';
      const offsetLbl = document.createElement('span');
      offsetLbl.className = 'offset-label';
      offsetLbl.textContent = '+-offset';
      const offsetInput = document.createElement('input');
      offsetInput.type = 'number';
      offsetInput.className = 'offset-input';
      offsetInput.id = 'offset-' + i;
      offsetInput.min = -500;
      offsetInput.max = 500;
      offsetInput.step = 5;
      offsetInput.value = offsets[i];
      offsetInput.title = 'Trim offset us (+-500, step 5)';
      (function(idx) {
        offsetInput.onchange = function() {
          let v = parseInt(offsetInput.value, 10);
          if (isNaN(v)) v = 0;
          v = Math.max(-500, Math.min(500, v));
          v = Math.round(v / 5) * 5;
          offsetInput.value = v;
          offsets[idx] = v;
          send({ type: 'cmd_offset', index: idx, offset_us: v });
        };
      })(i);
      offsetCell.appendChild(offsetLbl);
      offsetCell.appendChild(offsetInput);

      // Slider
      var slider = document.createElement('input');
      slider.type = 'range';
      slider.min = SERVO_MIN;
      slider.max = SERVO_MAX;
      slider.step = 1;
      slider.value = values[i];
      slider.id = 'slider-' + i;
      slider.disabled = true;
      (function(idx, sl) {
        sl.addEventListener('pointerdown', function() { _dragging = true; });
        sl.addEventListener('pointerup',   function() { _dragging = false; });
        sl.oninput = function() {
          var v = parseInt(sl.value, 10);
          var n = document.getElementById('num-' + idx);
          if (n) n.value = v;
          throttledSendServo(idx, v);
        };
        sl.onchange = function() {
          sendServo(idx, parseInt(sl.value, 10));
        };
      })(i, slider);

      // Paired number input
      var numInput = document.createElement('input');
      numInput.type = 'number';
      numInput.min = SERVO_MIN;
      numInput.max = SERVO_MAX;
      numInput.value = values[i];
      numInput.id = 'num-' + i;
      numInput.disabled = true;
      (function(idx, ni) {
        ni.onchange = function() {
          var v = parseInt(ni.value, 10);
          if (isNaN(v)) v = values[idx];
          v = Math.max(SERVO_MIN, Math.min(SERVO_MAX, v));
          ni.value = v;
          var sl = document.getElementById('slider-' + idx);
          if (sl) sl.value = v;
          sendServo(idx, v);
        };
      })(i, numInput);

      // Wiggle button
      var wiggleBtn = document.createElement('button');
      wiggleBtn.className = 'test-btn wiggle-btn';
      wiggleBtn.textContent = '~';
      wiggleBtn.title = 'Wiggle +-20 us for 2 s - identifies this servo';
      (function(idx) {
        wiggleBtn.onclick = function() { wiggleServo(idx, wiggleBtn); };
      })(i);

      row.appendChild(label);
      row.appendChild(sel);
      row.appendChild(slider);
      row.appendChild(numInput);
      row.appendChild(offsetCell);
      row.appendChild(wiggleBtn);
      grid.appendChild(row);
    });
  }

  // -- Presets ---------------------------------------------------
  function loadPreset(pose) {
    pose.forEach(function(v, i) {
      values[i] = v;
      var sl = document.getElementById('slider-' + i);
      var n  = document.getElementById('num-' + i);
      if (sl) sl.value = v;
      if (n)  n.value  = v;
      send({ type: 'cmd_servo', index: i, pulse_us: v });
    });
  }

  // -- Copy C array (SERVO_PINS from currentPins) ----------------
  function copyValues() {
    const line1 = '    ' + currentPins.slice(0, 4).map(function(p) { return String(p).padStart(2); }).join(', ') +
                  '   // ' + SERVO_NAMES.slice(0, 4).join(', ');
    const line2 = '    ' + currentPins.slice(4, 8).map(function(p) { return String(p).padStart(2); }).join(', ') +
                  '   // ' + SERVO_NAMES.slice(4, 8).join(', ');
    const text = 'uint8_t SERVO_PINS[8] = {\n' + line1 + ',\n' + line2 + '\n};';
    navigator.clipboard.writeText(text).then(function() {
      const fb = document.getElementById('copy-feedback');
      fb.classList.add('show');
      setTimeout(function() { fb.classList.remove('show'); }, 1500);
    }).catch(function() { showToast('Copy failed'); });
  }

  // -- Firmware event log ----------------------------------------
  const MAX_LOG_ROWS = 200;

  function handleFwEvent(msg) {
    const log = document.getElementById('event-log');
    if (!log) return;

    const ts = new Date();
    const hh = String(ts.getHours()).padStart(2,'0');
    const mm = String(ts.getMinutes()).padStart(2,'0');
    const ss = String(ts.getSeconds()).padStart(2,'0');
    const ms = String(ts.getMilliseconds()).padStart(3,'0');
    const timeStr = hh+':'+mm+':'+ss+'.'+ms;

    const evName = msg.event || '?';
    let extra  = Object.entries(msg)
      .filter(function(pair) { return !['type','event','t'].includes(pair[0]); })
      .map(function(pair) { return pair[0]+'='+pair[1]; })
      .join('  ');
    if (extra.length > 300) extra = extra.slice(0, 297) + '...';

    const row = document.createElement('div');
    const isWarn = /timeout|lost|rejected|low_battery/.test(evName);
    const isLc   = evName === 'lifecycle';
    row.className = 'ev-row' + (isWarn ? ' evt-warn' : '') + (isLc ? ' evt-lifecycle' : '');

    const tsEl = document.createElement('span');
    tsEl.className = 'ev-ts';
    tsEl.textContent = timeStr;

    const nameEl = document.createElement('span');
    nameEl.className = 'ev-name';
    nameEl.textContent = evName;

    const detailEl = document.createElement('span');
    detailEl.className = 'ev-detail';
    detailEl.textContent = extra;

    row.appendChild(tsEl);
    row.appendChild(nameEl);
    row.appendChild(detailEl);

    log.appendChild(row);
    while (log.children.length > MAX_LOG_ROWS) log.removeChild(log.firstChild);
    log.scrollTop = log.scrollHeight;
  }

  function clearEventLog() {
    const log = document.getElementById('event-log');
    if (log) log.textContent = '';
  }

  // -- Init ------------------------------------------------------
  buildGrid();
  connect();
</script>
