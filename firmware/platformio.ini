; PlatformIO config for Bark-Buddy custom firmware
; Target: ESP32-S3 (Hiwonder MechDog controller)

[env:mechdog]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip  ; arduino-esp32 core 3.3.8 / ESP-IDF v5.5.4 (migrated 2026-04-20)
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7
board_build.partitions = min_spiffs.csv
extra_scripts =
    pre:pre_build.py
    pre:pre_upload.py
build_flags =
    -std=gnu++17
    -DARDUINO_JSON_USE_DOUBLE=0
    -DPINS_VERIFIED=1
    -DWIFI_ENABLED=1
    -DCORE_DEBUG_LEVEL=0
    -DPIO_PLATFORM_VER=\"55.03.38-1\"
