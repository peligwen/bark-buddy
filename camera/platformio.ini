; PlatformIO config for the vision module firmware.
; Target: Hiwonder ESP32-S3 AI Vision Module (the MechDog's camera).
;
; Board settings follow Hiwonder's Arduino IDE setup for this module:
; ESP32S3 Dev Module, 8 MB flash, QIO 80 MHz, OPI PSRAM, Huge APP partitions.

[env:camera]
platform = espressif32@8.0.0  ; arduino-esp32 core 3.3.12, bundles the esp32-camera driver
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.partitions = huge_app.csv
build_flags =
    -DBOARD_HAS_PSRAM
